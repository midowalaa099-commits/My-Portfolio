<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>Order App — Workflow overview</title><desc>A source-based ordering workflow. Customer places a pending order. The restaurant owner progresses it through preparing, on the way and delivered. The customer can cancel while pending. Authentication, ownership policies and admin review govern access.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101B32"/><stop offset="1" stop-color="#080E1B"/></linearGradient><linearGradient id="node" x2="0.6" y2="1"><stop stop-color="#1A2B50"/><stop offset="1" stop-color="#14213D"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#6B8FF9" stroke-width="1.8"/></marker><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5A70A7" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#F5F3EC;font-size:58px;font-weight:700;letter-spacing:-2px}.eyebrow{fill:#8DAEFF;font-size:18px;font-weight:700;letter-spacing:3px}.desc{fill:#A6B0C4;font-size:25px}.label{fill:#F5F3EC;font-size:24px;font-weight:700}.sub{fill:#A6B0C4;font-size:19px}.index{fill:#7F9EFF;font-size:18px;font-weight:700;letter-spacing:2px}.note{fill:#B8C4DE;font-size:21px}.small{fill:#7E8AA4;font-size:16px;letter-spacing:2px}</style><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><rect x="96" y="70" width="42" height="5" rx="2.5" fill="#6B8FF9"/><text x="154" y="80" class="eyebrow">ORDER APP / WORKFLOW OVERVIEW</text><text x="96" y="160" class="title">Every role has a clear boundary.</text><text x="96" y="209" class="desc">Three roles. Five order states. Rules enforced on the server.</text><rect x="911" y="261" width="433" height="40" rx="20" fill="#172845" stroke="#344F85"/><text x="933" y="288" class="note">Restaurant owner advances the order</text><rect x="96" y="338" width="224" height="172" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="96" y="338" width="224" height="4" rx="2" fill="#5E85F7"/><text x="116" y="375" class="index">01</text><text x="116" y="419" class="label">Customer</text><text x="116" y="485" class="sub">Places order</text><path d="M322 424H348" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="352" y="338" width="224" height="172" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="352" y="338" width="224" height="4" rx="2" fill="#5E85F7"/><text x="372" y="375" class="index">02</text><text x="372" y="419" class="label">Pending</text><text x="372" y="485" class="sub">Awaiting action</text><path d="M578 424H604" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="608" y="338" width="224" height="172" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="608" y="338" width="224" height="4" rx="2" fill="#5E85F7"/><text x="628" y="375" class="index">03</text><text x="628" y="419" class="label">Preparing</text><text x="628" y="485" class="sub">Restaurant action</text><path d="M834 424H860" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="864" y="338" width="224" height="172" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="864" y="338" width="224" height="4" rx="2" fill="#5E85F7"/><text x="884" y="375" class="index">04</text><text x="884" y="419" class="label">On the way</text><text x="884" y="485" class="sub">Scoped tracking</text><path d="M1090 424H1116" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1120" y="338" width="224" height="172" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="1120" y="338" width="224" height="4" rx="2" fill="#5E85F7"/><text x="1140" y="375" class="index">05</text><text x="1140" y="419" class="label">Delivered</text><text x="1140" y="485" class="sub">Completed</text><path d="M464 512V605" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="352" y="620" width="224" height="130" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="352" y="620" width="224" height="4" rx="2" fill="#5E85F7"/><text x="372" y="657" class="index">CUSTOMER</text><text x="372" y="701" class="label">Cancelled</text><text x="372" y="725" class="sub">Only while pending</text><rect x="96" y="620" width="224" height="130" rx="16" fill="#111D34" stroke="#2A3A5A"/><text x="116" y="658" class="index">ACCESS</text><text x="116" y="696" class="note">Sanctum identity</text><text x="116" y="727" class="sub">Ownership policies</text><rect x="608" y="620" width="352" height="130" rx="16" fill="#111D34" stroke="#2A3A5A"/><text x="630" y="658" class="index">OWNER</text><text x="630" y="696" class="note">Own restaurants + meals</text><text x="630" y="727" class="sub">Own restaurant orders only</text><rect x="992" y="620" width="352" height="130" rx="16" fill="#112844" stroke="#365D90"/><text x="1014" y="658" class="index">ADMIN</text><text x="1014" y="696" class="note">Review owner applications</text><text x="1014" y="727" class="sub">Explicit protected endpoints</text><path d="M96 810H1344" stroke="#28344B"/><text x="96" y="846" class="small">SOURCE-BASED DIAGRAM · NOT AN APPLICATION SCREENSHOT</text><text x="1059" y="846" class="small">PHP / LARAVEL / SQL</text></svg>