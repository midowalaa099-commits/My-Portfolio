<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img"><title>MVP Bank — Architecture overview</title><desc>A source-based illustration of the authenticated banking request, policies, service, locked transaction and stored balance/history flow. Duplicate requests return the existing receipt.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101B32"/><stop offset="1" stop-color="#080E1B"/></linearGradient><linearGradient id="node" x2="0.6" y2="1"><stop stop-color="#1A2B50"/><stop offset="1" stop-color="#14213D"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#6B8FF9" stroke-width="1.8"/></marker><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#5A70A7" stroke-opacity=".07"/></pattern></defs><style>text{font-family:Arial,Helvetica,sans-serif}.title{fill:#F5F3EC;font-size:58px;font-weight:700;letter-spacing:-2px}.eyebrow{fill:#8DAEFF;font-size:18px;font-weight:700;letter-spacing:3px}.desc{fill:#A6B0C4;font-size:25px}.label{fill:#F5F3EC;font-size:24px;font-weight:700}.sub{fill:#A6B0C4;font-size:19px}.index{fill:#7F9EFF;font-size:18px;font-weight:700;letter-spacing:2px}.note{fill:#B8C4DE;font-size:21px}.small{fill:#7E8AA4;font-size:16px;letter-spacing:2px}</style><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><rect x="96" y="70" width="42" height="5" rx="2.5" fill="#6B8FF9"/><text x="154" y="80" class="eyebrow">MVP BANK / ARCHITECTURE OVERVIEW</text><text x="96" y="160" class="title">Correctness, before convenience.</text><text x="96" y="209" class="desc">A money request passes through explicit checks and one atomic operation.</text><rect x="1065" y="69" width="279" height="38" rx="19" fill="#1B2B49" stroke="#344F85"/><text x="1087" y="94" class="small">SIMULATED BANKING</text><rect x="96" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="96" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="116" y="373" class="index">01</text><text x="116" y="417" class="label">Browser</text><text x="116" y="505" class="sub">Money request</text><path d="M286 433H304" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="308" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="308" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="328" y="373" class="index">02</text><text x="328" y="417" class="label">Sanctum</text><text x="328" y="505" class="sub">Identity</text><path d="M498 433H516" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="520" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="520" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="540" y="373" class="index">03</text><text x="540" y="417" class="label">Policies</text><text x="540" y="505" class="sub">Ownership</text><path d="M710 433H728" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="732" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="732" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="752" y="373" class="index">04</text><text x="752" y="417" class="label">Banking</text><text x="752" y="446" class="label">Service</text><text x="752" y="505" class="sub">Money rules</text><path d="M922 433H940" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="944" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="944" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="964" y="373" class="index">05</text><text x="964" y="417" class="label">Transaction</text><text x="964" y="446" class="label">+ row locks</text><text x="964" y="505" class="sub">Atomic changes</text><path d="M1134 433H1152" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="1156" y="336" width="188" height="194" rx="16" fill="url(#node)" stroke="#344F85" stroke-width="1.5"/><rect x="1156" y="336" width="188" height="4" rx="2" fill="#5E85F7"/><text x="1176" y="373" class="index">06</text><text x="1176" y="417" class="label">Balances</text><text x="1176" y="446" class="label">+ history</text><text x="1176" y="505" class="sub">Stored together</text><path d="M826 532V580H1038V614" fill="none" stroke="#6B8FF9" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="96" y="620" width="612" height="134" rx="16" fill="#111D34" stroke="#2A3A5A"/><text x="122" y="657" class="index">ONE TRANSACTION</text><text x="122" y="696" class="note">Account locks → balance checks → stored receipt</text><text x="122" y="728" class="sub">All changes commit together, or roll back.</text><rect x="732" y="620" width="612" height="134" rx="16" fill="#112844" stroke="#365D90"/><text x="758" y="657" class="index">REPEATED REQUEST</text><text x="758" y="696" class="note">Same key + same operation → existing receipt</text><text x="758" y="728" class="sub">A retry does not debit the account again.</text><path d="M96 810H1344" stroke="#28344B"/><text x="96" y="846" class="small">SOURCE-BASED DIAGRAM · NOT AN APPLICATION SCREENSHOT</text><text x="1059" y="846" class="small">PHP / LARAVEL / SQL</text></svg>